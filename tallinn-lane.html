<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tallinn lane – procedural prototype</title>
<style>
:root{--bg:#e9edf5;--fg:#10131c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--fg:#e8ecf5}}
:root[data-theme="dark"]{--bg:#10131c;--fg:#e8ecf5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Georgia,serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block}
.chip{position:fixed;background:rgba(16,19,28,.72);color:#f1ead8;border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px)}
#top{left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:10px;align-items:center}
button{font:inherit;color:#f1ead8;background:#6a2e24;border:0;border-radius:8px;padding:6px 10px}
#hint{left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:60vw;font-size:12px}
#vert{right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px}
#vert button{width:54px;height:54px;font-size:20px;background:rgba(16,19,28,.72)}
</style></head><body>
<div id="top" class="chip"><span>Tallinn lane, generated from rules</span><button id="re">New street</button></div>
<div id="hint" class="chip"></div>
<div id="vert"><button id="up">▲</button><button id="dn">▼</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let seed=7;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const R=(a,b)=>a+rnd()*(b-a),pick=a=>a[(rnd()*a.length)|0],clamp=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),SKY=0x262c4a;scene.background=new THREE.Color(SKY);scene.fog=new THREE.FogExp2(SKY,0.017);
const cam=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,320);
scene.add(new THREE.HemisphereLight(0x93a6dc,0x3a2f2a,1.0));
const moon=new THREE.DirectionalLight(0xaab8ff,0.55);moon.position.set(-20,40,10);scene.add(moon);
const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t};
const mat=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
// cobblestones
const cobble=cv(512,512,(g,w,h)=>{g.fillStyle='#1f1c1a';g.fillRect(0,0,w,h);
 for(let r=0;r<10;r++)for(let c=-1;c<9;c++){const x=(c+(r%2)*.5)*64+R(-2,2),y=r*51.2+R(-1,1);
  g.fillStyle=`hsl(${R(20,38)},${R(5,13)}%,${R(30,48)}%)`;g.beginPath();g.roundRect(x+3,y+3,58,45,14);g.fill();}});
cobble.repeat.set(4.3,95);
const street=new THREE.Mesh(new THREE.PlaneGeometry(8.6,190),new THREE.MeshStandardMaterial({map:cobble,bumpMap:cobble,bumpScale:4,roughness:.85}));
street.rotation.x=-Math.PI/2;street.position.set(0,0,-55);scene.add(street);
const base=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x15171f));base.rotation.x=-Math.PI/2;base.position.y=-.02;scene.add(base);
for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.BoxGeometry(1.2,.16,190),mat(0x6f6d70));w.position.set(s*4.6,.08,-55);scene.add(w);}
// facades
const pal=['#d9b99b','#c9d4b8','#e3c9a0','#b9c7d6','#d8a89a','#e6dcc3','#a9b8a0','#cfae8c'];
const FAC=pal.map(c=>{const lit=Array.from({length:12},()=>rnd()<.45);
 const draw=e=>(g,w,h)=>{g.fillStyle=e?'#000':c;g.fillRect(0,0,w,h);
  for(let r=0;r<3;r++)for(let k=0;k<4;k++){const x=k*128+30,y=r*128+22,L=lit[r*4+k];
   g.fillStyle=e?'#000':'#efe8da';g.fillRect(x-5,y-5,78,88);
   g.fillStyle=e?(L?'#ffcf80':'#000'):(L?'#c9a460':'#1a2236');g.fillRect(x,y,68,78);
   g.fillStyle=e?'#000':'#efe8da';g.fillRect(x+32,y,4,78);g.fillRect(x,y+36,68,4);
   if(!e){g.fillStyle='#b9ad98';g.fillRect(x-8,y+82,84,6);}}};
 const m=cv(512,384,draw(false)),em=cv(512,384,draw(true));
 for(const t of[m,em])t.repeat.set(1/12,1/9.6);
 return{face:mat(0xffffff,{map:m,emissiveMap:em,emissive:0xffc070}),side:mat(c)};});
const ROOF=[0x8e3b2c,0xa24a33,0x7a3a30,0x5d3b35].map(c=>mat(c)),WOOD=mat(0x3b2a20),DARK=new THREE.MeshStandardMaterial({color:0x22252e,metalness:.7,roughness:.4});
const glow=cv(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);});
const glowMat=new THREE.SpriteMaterial({map:glow,color:0xffc678,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});
const poolMat=new THREE.MeshBasicMaterial({map:glow,color:0xffb860,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:.55});
const lampLight=new THREE.MeshBasicMaterial({color:0xffdca0});
const world=new THREE.Group();scene.add(world);
function house(side,z,w,d,fl){
 const H=fl*3.2,rh=w*.42,F=pick(FAC),g=new THREE.Group();
 const sh=new THREE.Shape([[-w/2,0],[w/2,0],[w/2,H],[0,H+rh],[-w/2,H]].map(p=>new THREE.Vector2(p[0],p[1])));
 const geo=new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false});geo.rotateY(Math.PI/2);
 g.add(new THREE.Mesh(geo,[F.face,F.side]));
 const a=Math.atan2(rh,w/2),L=Math.hypot(w/2,rh)+.4,rm=pick(ROOF);
 for(const s of[1,-1]){const sl=new THREE.Mesh(new THREE.BoxGeometry(d+.5,.22,L),rm);sl.rotation.x=s*a;sl.position.set(d/2,H+rh/2+.1,s*(w/4+.05));g.add(sl);}
 const ch=new THREE.Mesh(new THREE.BoxGeometry(.7,1.8,.7),mat(0x7d746c));ch.position.set(d*.6,H+rh*.5+.7,pick([1,-1])*w*.22);g.add(ch);
 const dr=new THREE.Mesh(new THREE.BoxGeometry(.2,2.4,1.3),WOOD);dr.position.set(-.05,1.2,R(-w/2+1.2,w/2-1.2));g.add(dr);
 g.position.set(side*5.2,0,z);if(side<0)g.rotation.y=Math.PI;world.add(g);}
function lamp(x,z){
 const p=new THREE.Mesh(new THREE.CylinderGeometry(.06,.1,4.2,8),DARK);p.position.set(x,2.1,z);
 const l=new THREE.Mesh(new THREE.BoxGeometry(.4,.55,.4),lampLight);l.position.set(x,4.5,z);
 const c=new THREE.Mesh(new THREE.ConeGeometry(.38,.35,4),DARK);c.position.set(x,4.95,z);c.rotation.y=Math.PI/4;
 const s=new THREE.Sprite(glowMat);s.scale.set(3.6,3.6,1);s.position.set(x,4.5,z);
 const pl=new THREE.Mesh(new THREE.PlaneGeometry(8,8),poolMat);pl.rotation.x=-Math.PI/2;pl.position.set(x*.4,.03,z);
 world.add(p,l,c,s,pl);}
function build(s){seed=s;world.clear();
 for(const side of[1,-1]){let z=34;while(z>-136){const w=pick([6,6,12]),d=R(9,14),fl=pick([2,3,3,4,5]);house(side,z-w/2,w,d,fl);z-=w;}}
 for(let i=0,z=14;z>-140;z-=14,i++)lamp(i%2?4.3:-4.3,z);
 const st=mat(0x8a857c),T=new THREE.Mesh(new THREE.BoxGeometry(8,22,8),st);T.position.set(0,11,-148);
 const C=new THREE.Mesh(new THREE.ConeGeometry(6.3,15,4),ROOF[1]);C.rotation.y=Math.PI/4;C.position.set(0,29.5,-148);
 const Wn=new THREE.Mesh(new THREE.PlaneGeometry(1.4,3.4),new THREE.MeshBasicMaterial({color:0xffcf80}));Wn.position.set(0,12,-143.9);
 world.add(T,C,Wn);}
// drone
const drone=new THREE.Group(),dl=new THREE.PointLight(0x5fd4ff,.9,9);
const body=new THREE.Mesh(new THREE.SphereGeometry(.38,20,14),DARK);body.scale.set(1,.7,1.2);
const eye=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),new THREE.MeshBasicMaterial({color:0x7fe3ff}));eye.position.set(0,0,-.42);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.55,.03,8,32),new THREE.MeshBasicMaterial({color:0x5fd4ff}));ring.rotation.x=Math.PI/2;
const rot=[];for(const[x,z]of[[1,1],[-1,1],[1,-1],[-1,-1]]){const r=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.02,16),new THREE.MeshBasicMaterial({color:0x9fb4c8,transparent:true,opacity:.45}));r.position.set(x*.5,.18,z*.5);rot.push(r);drone.add(r);}
drone.add(body,eye,ring,dl);scene.add(drone);drone.position.set(0,2.2,26);
// input
let yaw=0,pitch=.25;const kb={},vel=new THREE.Vector3(),joy={x:0,y:0},js={id:null,x:0,y:0},lk={id:null,x:0,y:0},vb={u:0,d:0};
addEventListener('keydown',e=>kb[e.code]=1);addEventListener('keyup',e=>kb[e.code]=0);
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&e.clientX<innerWidth/2){js.id=e.pointerId;js.x=e.clientX;js.y=e.clientY}else{lk.id=e.pointerId;lk.x=e.clientX;lk.y=e.clientY}});
addEventListener('pointermove',e=>{if(e.pointerId===js.id){joy.x=clamp((e.clientX-js.x)/50);joy.y=clamp((e.clientY-js.y)/50)}
 else if(e.pointerId===lk.id){yaw-=(e.clientX-lk.x)*.006;pitch=clamp(pitch+(e.clientY-lk.y)*.004,-.2,1.1);lk.x=e.clientX;lk.y=e.clientY}});
const end=e=>{if(e.pointerId===js.id){js.id=null;joy.x=joy.y=0}if(e.pointerId===lk.id)lk.id=null};
addEventListener('pointerup',end);addEventListener('pointercancel',end);
for(const[id,k,v]of[['up','u',1],['dn','d',1]]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.stopPropagation();vb[k]=1});b.addEventListener('pointerup',()=>vb[k]=0);b.addEventListener('pointerleave',()=>vb[k]=0);}
document.getElementById('re').onclick=()=>build((Math.random()*1e6)|0);
document.getElementById('hint').textContent='ontouchstart' in window?'Left thumb flies, right thumb looks, ▲▼ climb and drop.':'WASD flies, drag to look, Space and Shift climb and drop.';
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
build(7);
const clk=new THREE.Clock();
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 const fw=(kb.KeyW||kb.ArrowUp?1:0)-(kb.KeyS||kb.ArrowDown?1:0)-joy.y,st=(kb.KeyD||kb.ArrowRight?1:0)-(kb.KeyA||kb.ArrowLeft?1:0)+joy.x,
 up=(kb.Space||kb.KeyE||vb.u?1:0)-(kb.ShiftLeft||kb.KeyQ||vb.d?1:0);
 const tgt=new THREE.Vector3(-Math.sin(yaw)*fw+Math.cos(yaw)*st,up*.8,-Math.cos(yaw)*fw-Math.sin(yaw)*st).multiplyScalar(9);
 vel.lerp(tgt,1-Math.exp(-5*dt));drone.position.addScaledVector(vel,dt);
 const p=drone.position;p.z=clamp(p.z,-143,36);p.y=clamp(p.y,.9,45);if(p.y<22)p.x=clamp(p.x,-4.7,4.7);
 drone.rotation.set(-fw*.18,yaw,-st*.18,'YXZ');body.position.y=Math.sin(t*3)*.05;ring.rotation.z=t*2;rot.forEach((r,i)=>r.rotation.y=t*40+i);
 const D=5.5,cp=Math.cos(pitch);cam.position.set(p.x+Math.sin(yaw)*cp*D,p.y+Math.sin(pitch)*D+.6,p.z+Math.cos(yaw)*cp*D);
 cam.position.y=Math.max(cam.position.y,.4);cam.lookAt(p.x,p.y+.4,p.z);renderer.render(scene,cam);})();
</script></body></html>
